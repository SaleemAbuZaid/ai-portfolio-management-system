<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">APEX AI Portfolio Management System Architecture</title>
  <desc id="desc">Landscape block diagram for a local defense prototype showing external providers, FastAPI backend services, runtime infrastructure, React dashboard, and Step 7 proof outputs.</desc>
  <defs>
    <style>
      .canvas { fill: #fbfcff; }
      .title { font-family: Inter, Arial, sans-serif; font-size: 36px; font-weight: 800; fill: #172033; letter-spacing: 0; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #4b5870; letter-spacing: 0; }
      .section-title { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #172033; letter-spacing: 0.5px; text-transform: uppercase; }
      .node-title { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #172033; letter-spacing: 0; }
      .node-subtitle { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #4b5870; letter-spacing: 0; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #5d687b; letter-spacing: 0; }
      .flow-label { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #354052; letter-spacing: 0; }
      .footer { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #354052; letter-spacing: 0; }
      .footer-strong { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 900; fill: #9a1b30; letter-spacing: 0; }
      .external-panel { fill: #eaf3ff; stroke: #1e5b9a; stroke-width: 2; }
      .backend-panel { fill: #eaf8ef; stroke: #1f7a46; stroke-width: 2; }
      .infra-panel { fill: #fff7d8; stroke: #a56a00; stroke-width: 2; }
      .ui-panel { fill: #f2eaff; stroke: #6d35b3; stroke-width: 2; }
      .proof-panel { fill: #ffecf1; stroke: #a51d34; stroke-width: 2; }
      .external-node { fill: #f7fbff; stroke: #2f6fb1; stroke-width: 1.8; }
      .backend-node { fill: #f8fff9; stroke: #2c8f55; stroke-width: 1.8; }
      .infra-node { fill: #fffdf1; stroke: #b5770b; stroke-width: 1.8; }
      .ui-node { fill: #fbf7ff; stroke: #7a46c2; stroke-width: 1.8; }
      .proof-node { fill: #fff8fa; stroke: #b72a43; stroke-width: 1.8; }
      .constraint-box { fill: #fff7f8; stroke: #c53b53; stroke-width: 1.8; }
      .connector { fill: none; stroke: #59657a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #7a8495; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSoft); }
      .connector-dashed { fill: none; stroke: #8c7440; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 8; marker-end: url(#arrowInfra); }
      .ws-connector { fill: none; stroke: #6d35b3; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowUi); }
      .proof-connector { fill: none; stroke: #a51d34; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowProof); }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1b2740" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1b2740" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#59657a"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#7a8495"/>
    </marker>
    <marker id="arrowInfra" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#8c7440"/>
    </marker>
    <marker id="arrowUi" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#6d35b3"/>
    </marker>
    <marker id="arrowProof" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#a51d34"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="960"/>

  <g id="header">
    <text class="title" x="60" y="58">APEX AI Portfolio Management System</text>
    <text class="subtitle" x="60" y="90">Architecture block diagram for a local university defense prototype</text>
    <rect class="constraint-box" x="1020" y="34" width="510" height="74" rx="10" filter="url(#softShadow)"/>
    <text class="footer-strong" x="1044" y="63">Academic truth boundary</text>
    <text class="small" x="1044" y="86">AI outputs are advisory only. Alpaca evidence is limited to paper-trading UUIDs.</text>
  </g>

  <g id="panels" filter="url(#shadow)">
    <rect class="external-panel" x="50" y="154" width="240" height="482" rx="14"/>
    <rect class="backend-panel" x="338" y="130" width="540" height="548" rx="14"/>
    <rect class="ui-panel" x="956" y="190" width="256" height="414" rx="14"/>
    <rect class="proof-panel" x="1290" y="190" width="260" height="414" rx="14"/>
    <rect class="infra-panel" x="338" y="730" width="874" height="158" rx="14"/>
  </g>

  <g id="section-labels">
    <text class="section-title" x="76" y="188">External Providers</text>
    <text class="section-title" x="366" y="164">FastAPI Backend</text>
    <text class="section-title" x="982" y="224">React Dashboard</text>
    <text class="section-title" x="1318" y="224">Defense Evidence</text>
    <text class="section-title" x="366" y="764">Persistence &amp; Runtime</text>
  </g>

  <g id="external-nodes" filter="url(#softShadow)">
    <rect class="external-node" x="76" y="226" width="188" height="88" rx="10"/>
    <text class="node-title" x="100" y="262">Market Data</text>
    <text class="node-subtitle" x="100" y="286">prices, history, ticks</text>

    <rect class="external-node" x="76" y="356" width="188" height="88" rx="10"/>
    <text class="node-title" x="100" y="392">News Sources</text>
    <text class="node-subtitle" x="100" y="416">articles, sentiment inputs</text>

    <rect class="external-node" x="76" y="486" width="188" height="88" rx="10"/>
    <text class="node-title" x="100" y="522">Alpaca Paper API</text>
    <text class="node-subtitle" x="100" y="546">paper account and orders</text>
  </g>

  <g id="backend-nodes" filter="url(#softShadow)">
    <rect class="backend-node" x="372" y="212" width="214" height="86" rx="10"/>
    <text class="node-title" x="398" y="247">Ingestion &amp;</text>
    <text class="node-title" x="398" y="270">Normalization</text>

    <rect class="backend-node" x="628" y="212" width="214" height="86" rx="10"/>
    <text class="node-title" x="654" y="247">REST API</text>
    <text class="node-title" x="654" y="270">Routers</text>

    <rect class="backend-node" x="628" y="330" width="214" height="86" rx="10"/>
    <text class="node-title" x="654" y="365">WebSocket</text>
    <text class="node-title" x="654" y="388">Stream</text>

    <rect class="backend-node" x="372" y="330" width="214" height="86" rx="10"/>
    <text class="node-title" x="398" y="365">AI Advisory</text>
    <text class="node-title" x="398" y="388">Layer</text>
    <text class="node-subtitle" x="398" y="407">non-binding signals</text>

    <rect class="backend-node" x="372" y="448" width="214" height="86" rx="10"/>
    <text class="node-title" x="398" y="483">Portfolio &amp;</text>
    <text class="node-title" x="398" y="506">Risk</text>

    <rect class="backend-node" x="628" y="448" width="214" height="86" rx="10"/>
    <text class="node-title" x="654" y="483">Execution</text>
    <text class="node-title" x="654" y="506">Audit</text>
    <text class="node-subtitle" x="654" y="525">paper UUID evidence</text>

    <rect class="backend-node" x="466" y="574" width="282" height="58" rx="10"/>
    <text class="node-title" x="493" y="609">Local orchestration service</text>
  </g>

  <g id="infra-nodes" filter="url(#softShadow)">
    <rect class="infra-node" x="372" y="798" width="220" height="60" rx="10"/>
    <text class="node-title" x="397" y="834">Redis Event Bus</text>

    <rect class="infra-node" x="662" y="798" width="246" height="60" rx="10"/>
    <text class="node-title" x="690" y="834">PostgreSQL / SQLite</text>

    <rect class="infra-node" x="978" y="798" width="196" height="60" rx="10"/>
    <text class="node-title" x="1005" y="834">Model Artifacts</text>
  </g>

  <g id="ui-nodes" filter="url(#softShadow)">
    <rect class="ui-node" x="986" y="278" width="196" height="92" rx="10"/>
    <text class="node-title" x="1013" y="313">Professional</text>
    <text class="node-title" x="1013" y="336">Dashboard</text>
    <text class="node-subtitle" x="1013" y="354">charts, portfolio, advice</text>

    <rect class="ui-node" x="986" y="430" width="196" height="92" rx="10"/>
    <text class="node-title" x="1013" y="465">Truth &amp;</text>
    <text class="node-title" x="1013" y="488">Provenance UI</text>
    <text class="node-subtitle" x="1013" y="506">source and freshness labels</text>
  </g>

  <g id="proof-nodes" filter="url(#softShadow)">
    <rect class="proof-node" x="1322" y="270" width="196" height="78" rx="10"/>
    <text class="node-title" x="1348" y="305">Step 7 Proof Set</text>
    <text class="node-subtitle" x="1348" y="326">screenshots and JSON</text>

    <rect class="proof-node" x="1322" y="386" width="196" height="78" rx="10"/>
    <text class="node-title" x="1348" y="421">Validation</text>
    <text class="node-title" x="1348" y="444">Outputs (PASS)</text>

    <rect class="proof-node" x="1322" y="502" width="196" height="78" rx="10"/>
    <text class="node-title" x="1348" y="537">Alpaca Paper</text>
    <text class="node-title" x="1348" y="560">UUID Evidence</text>
  </g>

  <g id="main-flow-connectors">
    <path class="connector" d="M 264 270 C 310 270 323 255 372 255"/>
    <text class="flow-label" x="287" y="238">price feed</text>

    <path class="connector" d="M 264 400 C 312 400 323 294 372 278"/>
    <text class="flow-label" x="287" y="360">news feed</text>

    <path class="connector" d="M 264 530 C 320 530 328 514 372 500"/>
    <text class="flow-label" x="282" y="556">paper broker link</text>

    <path class="connector-soft" d="M 586 255 L 628 255"/>
    <path class="connector-soft" d="M 479 298 L 479 330"/>
    <path class="connector-soft" d="M 586 373 L 628 373"/>
    <path class="connector-soft" d="M 479 416 L 479 448"/>
    <path class="connector-soft" d="M 586 491 L 628 491"/>
    <path class="connector-soft" d="M 735 298 L 735 330"/>
    <path class="connector-soft" d="M 735 416 L 735 448"/>

    <path class="connector" d="M 842 255 C 894 255 913 324 986 324"/>
    <text class="flow-label" x="883" y="265">REST API</text>

    <path class="ws-connector" d="M 842 373 C 902 373 916 475 986 476"/>
    <text class="flow-label" x="880" y="407">WebSocket updates</text>

    <path class="connector" d="M 842 491 C 925 491 928 324 986 324"/>
    <text class="flow-label" x="864" y="529">audit status</text>

    <path class="proof-connector" d="M 1182 324 C 1234 324 1260 309 1322 309"/>
    <text class="flow-label" x="1217" y="292">defense captures</text>

    <path class="proof-connector" d="M 1182 476 C 1238 476 1260 425 1322 425"/>
    <text class="flow-label" x="1218" y="460">validation view</text>

    <path class="proof-connector" d="M 842 491 C 1055 585 1200 541 1322 541"/>
    <text class="flow-label" x="1042" y="590">paper UUID proof trail</text>
  </g>

  <g id="infra-connectors">
    <path class="connector-dashed" d="M 735 416 C 735 648 482 652 482 798"/>
    <text class="flow-label" x="503" y="704">events and cache</text>

    <path class="connector-dashed" d="M 735 534 C 735 660 785 676 785 798"/>
    <text class="flow-label" x="790" y="704">audit persistence</text>

    <path class="connector-dashed" d="M 479 416 C 479 690 1076 688 1076 798"/>
    <text class="flow-label" x="1016" y="704">model load</text>
  </g>

  <g id="legend">
    <rect x="50" y="688" width="240" height="200" rx="12" fill="#ffffff" stroke="#cbd3df" stroke-width="1.5" filter="url(#softShadow)"/>
    <text class="section-title" x="74" y="724">Reading Guide</text>
    <line x1="76" y1="754" x2="130" y2="754" class="connector"/>
    <text class="small" x="146" y="759">primary data flow</text>
    <line x1="76" y1="786" x2="130" y2="786" class="ws-connector"/>
    <text class="small" x="146" y="791">live dashboard stream</text>
    <line x1="76" y1="818" x2="130" y2="818" class="connector-dashed"/>
    <text class="small" x="146" y="823">runtime dependency</text>
    <line x1="76" y1="850" x2="130" y2="850" class="proof-connector"/>
    <text class="small" x="146" y="855">defense evidence flow</text>
  </g>

  <g id="footer">
    <rect x="50" y="912" width="1500" height="2" rx="1" fill="#dbe2ec"/>
    <text class="footer" x="60" y="934">Scope: local defense prototype only. AI recommendations are advisory and non-binding.</text>
    <text class="footer" x="60" y="954">Execution evidence uses Alpaca Paper UUIDs only. No real-money execution, profit guarantee, or production deployment is implied.</text>
  </g>
</svg>
