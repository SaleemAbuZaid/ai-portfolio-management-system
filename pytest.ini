[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Small, fast tests with isolated units
    integration: Tests for multi-component flows
    backtest: Tests for trade engine
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
